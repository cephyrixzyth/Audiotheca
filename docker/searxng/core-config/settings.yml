# Minimal override — merges with SearXNG defaults
# https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  base_url: "http://127.0.0.1:8080/"
  secret_key: "audiotheca-local-searxng-dev-key-change-in-production"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

redis:
  url: redis://valkey:6379/0
