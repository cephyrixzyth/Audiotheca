# SearXNG — private meta search for Audiotheca research
# Docs: https://docs.searxng.org/admin/installation-docker.html

name: audiotheca-searxng

services:
  core:
    container_name: audiotheca-searxng
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:ro
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey

  valkey:
    container_name: audiotheca-searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
