[package]
name = "audiotheca"
version = "1.0.0"
description = "Audiotheca desktop shell"
authors = ["Audiotheca"]
edition = "2021"

[lib]
name = "audiotheca_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
