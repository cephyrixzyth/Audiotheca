name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust_targets: x86_64-pc-windows-msvc
            sidecar_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
            sidecar_target: x86_64-apple-darwin
            sidecar_arch: x86_64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
            sidecar_target: aarch64-apple-darwin
            sidecar_arch: arm64
          - platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"
            rust_targets: x86_64-unknown-linux-gnu
            sidecar_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file \
            libfuse2

      - name: Build sidecars
        env:
          AUDIOTHECA_TARGET: ${{ matrix.sidecar_target }}
          AUDIOTHECA_SIDECAR_ARCH: ${{ matrix.sidecar_arch }}
        run: python scripts/build_sidecars.py

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: "Audiotheca ${{ github.ref_name }}"
          releaseBody: |
            Desktop installers for Audiotheca ${{ github.ref_name }}.

            - Windows: `.msi` and NSIS `.exe`
            - macOS: `.dmg` (Intel and Apple Silicon matrix builds)
            - Linux: `.AppImage` and `.deb`

            Engine version 10.0.0 · UI/API 1.0.0
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
