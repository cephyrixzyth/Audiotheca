map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream audiotheca_api {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://audiotheca_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Optional: set AUDIOTHECA_PROXY_SECRET so session auth does not rely on
        # nginx→API appearing as localhost alone.
        # All-in-one image uses nginx-local.conf.template + entrypoint envsubst.
        proxy_set_header X-Audiotheca-Proxy-Secret "${AUDIOTHECA_PROXY_SECRET}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
